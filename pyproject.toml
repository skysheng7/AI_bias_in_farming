################################################################################
# Build Configuration
################################################################################

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

################################################################################
# Project Configuration
################################################################################

[project]
name = "AI_representation_bias_in_farming"

version = "0.1.0"

description = "This project explores the bias text-to-image generative AI models have about livestock farming. "
authors = [
    { name = "Kehan (Sky) Sheng", email = "skysheng7@gmail.com" },
]
license = "MIT"
readme = {"file" = "README.md", "content-type" = "text/markdown"}
requires-python = ">=3.10"
# Please consult https://pypi.org/classifiers/ for a full list.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

keywords = [ai bias, ai fairness, ai ethics, farm animal welfare, coded gaze]
dependencies = [
    "matplotlib>=3.9.2",
    "nltk>=3.9.1",
    "pandas>=2.2.3",
    "pillow>=11.0.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "scikit-learn>=1.5.2",
    "wordcloud>=1.9.4",
    "pydantic>=2.10.3",
    "click>=8.1.7",
]

[project.urls]
Homepage = "https://github.com/skysheng7/AI_representation_bias_in_farming"
"Source Code" = "https://github.com/skysheng7/AI_representation_bias_in_farming"
"Bug Tracker" = "https://github.com/skysheng7/AI_representation_bias_in_farming/issues"

[project.optional-dependencies]
dev = [
    "hatch",
    "pre-commit",
]



################################################################################
# Tool Configuration
################################################################################

[tool.hatch.build]
only-packages = true

[tool.hatch.build.targets.wheel]
packages = ["src/AI_representation_bias_in_farming"]

[tool.hatch.envs.test]
description = """Run the test suite."""
extra-dependencies = [
   "pytest",
   "pytest-cov", 
]

[[tool.hatch.envs.test.matrix]]
python = ["3.11"]

[tool.hatch.envs.format]
description = """Format your code."""
python = "3.11"
extra-dependencies = [
  "black",
  "isort",
]

[tool.hatch.envs.format.scripts]
format_code = [
   "isort .",
   "black ."
   ]



